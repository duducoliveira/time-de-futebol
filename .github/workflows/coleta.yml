name: Coleta diária e briefing do episódio

on:
  schedule:
    - cron: "17 11 * * *"   # 08:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m timefc coletar
      - run: python -m timefc preparar
      - name: Commit dos dados
        run: |
          git config user.name "timefc-bot"
          git config user.email "timefc-bot@users.noreply.github.com"
          git add dados/ episodios/
          git diff --cached --quiet || git commit -m "dados: coleta $(date -u +%F)"
          git push
